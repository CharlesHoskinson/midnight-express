[workspace]
members = ["mpe-core", "mpe-node", "mpe-client", "mpe-sim"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "macros", "ed25519"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
subtle = "2"
proptest = "1"
criterion = "0.5"

[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
lto = false
codegen-units = 16

[patch.crates-io]
libp2p-gossipsub = { path = "vendor/libp2p-gossipsub" }
