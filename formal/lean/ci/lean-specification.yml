name: Lean semantic specification

on:
  push:
    paths:
      - 'formal/lean/**'
      - 'model/**'
      - 'website/**'
      - '.github/workflows/lean-specification.yml'
  pull_request:
    paths:
      - 'formal/lean/**'
      - 'model/**'
      - 'website/**'
      - '.github/workflows/lean-specification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.lock.txt
      - name: Install locked model dependencies
        run: python -m pip install --require-hashes -r model/requirements.lock.txt
      - name: Install pinned Lean compiler
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.1
      - name: Kernel proofs, comprehensive audit, and finite fixture/replay bridge
        run: python formal/lean/check.py
      - name: Isolated negative proof-gate and translator tests
        run: python -m unittest discover -s formal/lean -p 'test_*.py' -v
      - name: Profile constants, published source, and theorem claims remain synchronized
        run: python formal/lean/publish.py --check
